%YAML 1.2
---
$id: http://devicetree.org/schemas/embedded-controller/asus,zenbook-a16-ux3607oa-ec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASUS Zenbook A16 (UX3607OA)-class Embedded Controller

maintainers:
  - Konrad Dybcio <konradybcio@kernel.org>

description:
  The Qualcomm Snapdragon X2 Elite (Extreme)-based ASUS Zenbook A16
  (and similar machines) come with a custom EC firwmare, loosely based
  on the Qualcomm reference ("Hamoa CRD EC") firwmare, with a lot of
  customization.

properties:
  compatible:
    enum:
      - asus,zenbook-a14-ux3407na-ec
      - asus,zenbook-a16-ux3607oa-ec

  reg:
    const: 0x76

  interrupts:
    maxItems: 1

  "#thermal-sensor-cells":
    const: 1

  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts
  - '#thermal-sensor-cells'
  - wakeup-source

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        embedded-controller@76 {
            compatible = "asus,zenbook-a16-ux3607oa-ec";
            reg = <0x76>;

            interrupts-extended = <&tlmm 66 IRQ_TYPE_EDGE_FALLING>;
        };
    };
...
